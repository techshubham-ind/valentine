<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Valentine Adity</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { background: #000; color: #ff0040; margin: 0; font-family: 'Montserrat', sans-serif; cursor: crosshair; }
        
        #lock { position: fixed; inset: 0; background: #000; z-index: 99; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .heart-beat { font-size: 6rem; animation: beat 0.8s infinite; cursor: pointer; text-shadow: 0 0 50px red; }
        @keyframes beat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.2);} }

        /* Main */
        .header { text-align: center; padding: 50px 20px; }
        h1 { font-size: 4rem; text-transform: uppercase; letter-spacing: 5px; margin: 0; text-shadow: 0 0 20px red; }
        
        /* The Mosaic Gallery */
        .mosaic { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 5px; padding: 10px; max-width: 1400px; margin: 0 auto;
        }
        
        .tile { 
            position: relative; aspect-ratio: 3/4; overflow: hidden; background: #111;
        }
        .tile img { 
            width: 100%; height: 100%; object-fit: cover; transition: 0.5s; filter: grayscale(100%);
        }
        .tile:hover img { filter: grayscale(0%); transform: scale(1.1); }
        
        .overlay {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 0;
            background: linear-gradient(to top, #ff0040, transparent);
            color: white; text-align: center; font-weight: 900; text-transform: uppercase;
            transform: translateY(100%); transition: 0.3s;
        }
        .tile:hover .overlay { transform: translateY(0); }

        .letter { max-width: 600px; margin: 50px auto; padding: 20px; border: 2px solid #ff0040; text-align: center; }
    </style>
</head>
<body>

    <div id="lock">
        <div class="heart-beat">❤</div>
        <input type="password" id="pass" placeholder="ADITY" onkeyup="check()" style="background:none; border:none; text-align:center; color:red; font-size:2rem; margin-top:20px; outline:none; font-weight:bold;">
    </div>

    <div id="content" style="display:none;">
        <div class="header">
            <p>YOU ARE MY</p>
            <h1>OBSESSION</h1>
        </div>

        <div class="mosaic" id="grid"></div>

        <div class="letter">
            <p>I don't just love you, Adity. I crave you. You are the smartest, hottest, and most beautiful thing that has ever happened to me. Be mine. Always.</p>
        </div>
    </div>

    <script>
        const intenseWords = [
            "MINE", "HOT", "SEXY", "CRAVE", "NEED", 
            "WANT", "LOVE", "LUST", "FIRE", "BURN",
            "SOUL", "LIPS", "EYES", "BODY", "MIND",
            "ONLY YOU", "FOREVER", "PASSION", "HEAT", "DESIRE",
            "ADDICTION", "DRUG", "HEART", "LIFE", "ADITY", "WIFE"
        ];

        function check() {
            if(document.getElementById('pass').value.toLowerCase() === 'adity') {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                loadTiles();
            }
        }

        function loadTiles() {
            const g = document.getElementById('grid');
            for(let i=1; i<=26; i++) {
                const word = intenseWords[i-1] || "LOVE";
                g.innerHTML += `
                <div class="tile">
                    <img src="img${i}.png" loading="lazy">
                    <div class="overlay">${word}</div>
                </div>`;
            }
        }
    </script>
</body>
</html>
